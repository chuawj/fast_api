<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한세 커뮤니티 게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR',sans-serif" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background: linear-gradient(120deg,#e0e7ff 0%,#f8fafc 100%);
            margin: 0; min-height: 100vh;
        }
        .container { max-width: 520px; margin: 48px auto; background: #fff;
            border-radius: 18px; box-shadow: 0 4px 24px #a9b8d722;
            padding: 34px 34px 26px 34px; display: flex; flex-direction: column; gap: 32px;}
        h1 { text-align: center; color: #3454e6; font-weight: 800; font-size: 2.1rem; margin: 0 0 8px 0; letter-spacing: -1px;}
        .subtitle { text-align: center; color: #6070a0; margin-bottom: 10px; font-size: 1.07rem; letter-spacing: -0.5px;}
        .form-area { background: #f7f8fc; padding: 22px 18px 14px 18px; border-radius: 11px; box-shadow: 0 2px 10px #d7e2f533; margin-bottom: 10px;}
        label { font-weight: 700; color: #222; margin-left: 3px; font-size:15px;}
        input, textarea {
            width: 100%; font-size: 15px; border-radius: 7px; border: 1.2px solid #c6d3ec;
            padding: 10px 11px; background: #fafdff; margin-top: 5px; margin-bottom: 16px; resize: none; transition: border 0.2s;
        }
        input:focus, textarea:focus { border-color: #6a90ff; outline: none;}
        textarea { height: 100px;}
        button { background: linear-gradient(90deg, #3454e6 80%, #38b2fe 120%); color: #fff;
            border: none; width: 100%; border-radius: 7px; padding: 13px 0; font-size: 17px; font-weight: 700;
            letter-spacing: 1.5px; cursor: pointer; transition: background 0.2s; box-shadow: 0 2px 7px #aecbfa33; margin-bottom: 4px;}
        button:hover { background: linear-gradient(90deg, #2647be 75%, #32afd9 110%);}
        .post-list-area { margin-top: 10px;}
        .post-list-title { font-size: 1.18rem; font-weight: bold; color: #3454e6; margin-bottom: 16px; text-align: left;}
        .posts { display: flex; flex-direction: column; gap: 15px;}
        .post-card { background: #f5f7fd; border-radius: 11px; padding: 17px 20px 13px 20px; box-shadow: 0 2px 12px #c6d3ec44; transition: box-shadow 0.2s; position: relative;}
        .post-card:hover { box-shadow: 0 4px 22px #aac5fa66;}
        .post-title { color: #2340c2; font-weight: 700; font-size: 1.1rem; margin-bottom: 3px;}
        .post-meta { font-size: 12.2px; color: #7890b5; margin-bottom: 5px;}
        .post-content { font-size: 15.5px; color: #323743; margin-bottom: 2px; word-break: break-all;}
        .no-posts { text-align: center; color: #aab0b7; margin: 23px 0 0 0; font-size:15px;}
        .login-msg { text-align: center; color: #c63b2b; font-size: 16px; margin-bottom: 12px;}
        @media (max-width: 650px) {
            .container { max-width: 98vw; padding: 11vw 3vw; }
            .form-area { padding: 13px 2vw 11px 2vw; }
            .post-card { padding: 13px 4vw 9px 4vw; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h1>한세 커뮤니티</h1>
            <div class="subtitle">자유롭게 글을 작성하고 공유해보세요.</div>
        </div>
        <div id="login-message" class="login-msg" style="display:none;">
            로그인 후 글을 작성할 수 있습니다.
        </div>
        <form id="create-form" class="form-area">
            <label for="title">제목</label>
            <input type="text" id="title" maxlength="50" placeholder="제목을 입력하세요 (최대 50자)" required>
            <label for="content">내용</label>
            <textarea id="content" maxlength="500" placeholder="내용을 입력하세요 (최대 500자)" required></textarea>
            <button type="submit">게시글 등록</button>
        </form>
        <div class="post-list-area">
            <div class="post-list-title">📑 최근 게시글</div>
            <div class="posts" id="posts"></div>
        </div>
    </div>
    <script>
        const API = "/posts/";

        // 게시글 목록 불러오기
        async function fetchPosts() {
            const res = await fetch(API);
            const posts = await res.json();
            const postsDiv = document.getElementById("posts");
            postsDiv.innerHTML = "";
            if (!posts.length) {
                postsDiv.innerHTML = '<div class="no-posts">아직 등록된 게시글이 없습니다.</div>';
                return;
            }
            posts.reverse().forEach(post => {
                postsDiv.innerHTML += `
                    <div class="post-card">
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-meta">작성자: ${escapeHtml(post.username)} | 등록일: ${post.created_at.slice(0, 10)}</div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                    </div>
                `;
            });
        }
        // XSS 방지
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 로그인 상태 확인 및 폼 표시 여부 조정
        function checkLogin() {
            const user_id = localStorage.getItem("user_id");
            const form = document.getElementById("create-form");
            const loginMsg = document.getElementById("login-message");
            if (!user_id || user_id === "null" || user_id === "undefined" || isNaN(Number(user_id))) {
                if (form) form.style.display = "none";
                if (loginMsg) loginMsg.style.display = "block";
            } else {
                if (form) form.style.display = "block";
                if (loginMsg) loginMsg.style.display = "none";
            }
        }

        // 게시글 작성 이벤트 (중복 없이 정리)
        document.addEventListener('DOMContentLoaded', () => {
            checkLogin();
            fetchPosts();

            const form = document.getElementById("create-form");
            if (form) {
                form.onsubmit = async function(e) {
                    e.preventDefault();
                    const title = document.getElementById("title").value;
                    const content = document.getElementById("content").value;

                    let user_id = localStorage.getItem("user_id");
                    if (!user_id || user_id === "null" || user_id === "undefined" || isNaN(Number(user_id))) {
                        alert("로그인이 필요합니다. 먼저 로그인하세요.");
                        return;
                    }
                    user_id = Number(user_id);

                    const res = await fetch(API, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title, content, user_id })
                    });
                    if (res.ok) {
                        form.reset();
                        fetchPosts();
                    } else {
                        alert("게시글 등록 실패: " + (await res.text()));
                    }
                };
            }
        });
    </script>
</body>
</html>
