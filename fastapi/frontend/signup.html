<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="style.css"> <!-- CSS 파일 연결 -->
    <!-- Font Awesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- // Font Awesome 아이콘 라이브러리 -->
    <!-- 비밀번호 보기/숨기기 아이콘 관련 스타일은 style.css에 추가해야 합니다. -->
    <!-- 예시: .password-input-container, .password-input-container input, .password-input-container .toggle-password-icon 등 -->
</head>
<body>
    <div class="container">
        <h2>회원가입</h2>
        <form id="signupForm">
            <div> <!-- 사용자 이름 필드 -->
                <label for="signupUsername">사용자 이름:</label>
                <input type="text" id="signupUsername" required>
            </div>

             <div> <!-- 이메일 필드 -->
                <label for="signupEmail">이메일:</label>
                <input type="email" id="signupEmail" required>
            </div>

            <!-- 비밀번호 입력 필드와 보기/숨기기 아이콘을 감싸는 div 추가 -->
            <div class="password-input-container"> <!-- class="password-input-container" 추가 -->
                 <label for="signupPassword">비밀번호:</label>
                 <!-- 비밀번호 입력 필드 -->
                 <input type="password" id="signupPassword" required>
                 <!-- 비밀번호 보기/숨기기 아이콘 -->
                 <i class="fas fa-eye toggle-password-icon" data-target="signupPassword"></i> <!-- class="toggle-password-icon", data-target="signupPassword" 추가 -->
             </div>
             <!-- // 비밀번호 입력 필드와 보기/숨기기 아이콘 -->


            <!-- 전화번호 및 생년월일 필드 -->
            <div>
                <label for="signupPhoneNumber">전화번호:</label>
                <input type="text" id="signupPhoneNumber" required placeholder="예: 01012345678 또는 010-1234-5678">
            </div>

            <div>
                <label for="signupBirthDate">생년월일:</label>
                <input type="text" id="signupBirthDate" required placeholder="예: YYYY-MM-DD">
            </div>
            <!-- // 전화번호 및 생년월일 필드 -->

            <button type="submit">가입하기</button>
        </form>

        <div id="message"></div> <!-- 메시지 표시 영역 -->

        <p><a href="login.html" class="link-to-page">이미 계정이 있으신가요? 로그인</a></p>

        <p style="text-align: center;">
            <a href="find_username.html" class="link-to-page" style="display: inline-block; margin: 0 5px;">아이디 찾기</a>
             |
            <a href="change_password.html" class="link-to-page" style="display: inline-block; margin: 0 5px;">비밀번호 찾기</a>
        </p>

    </div>

    <script src="script.js"></script> <!-- JavaScript 파일 연결 -->
</body>
</html>
