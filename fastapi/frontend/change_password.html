<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>비밀번호 변경</h1>

        <form id="changePasswordForm">

            <div id="identity-verification-section">
                 <p class="note">회원가입 시 사용한 정보로 본인 확인을 해주세요. 아이디(또는 이메일) 또는 전화번호 중 하나와 생년월일을 입력해주세요.</p>
                 <div>
                    <label for="verify_username">사용자 이름 또는 이메일:</label>
                    <input type="text" id="verify_username" placeholder="사용자 이름 또는 이메일 입력">
                </div>
                 <div>
                    <label for="verify_phone_number">전화번호:</label>
                    <input type="text" id="verify_phone_number" placeholder="예: 010-1234-5678">
                </div>
                 <div>
                    <label for="verify_birth_date">생년월일:</label>
                    <input type="text" id="verify_birth_date" required placeholder="예: YYYY-MM-DD">
                </div>
                <button type="button" id="verifyIdentityButton">본인 확인</button>
            </div>

            <div id="password-change-section">
                <p class="note">본인 확인이 완료되었습니다. 새로운 비밀번호를 입력해주세요.</p>

                <div class="password-input-container">
                    <label for="new_password">새로운 비밀번호:</label>
                    <input type="password" id="new_password" required>
                    <i class="fas fa-eye toggle-password-icon" data-target="new_password"></i>
                </div>

                <div class="password-input-container">
                     <label for="confirm_password">비밀번호 확인:</label>
                     <input type="password" id="confirm_password" required>
                     <i class="fas fa-eye toggle-password-icon" data-target="confirm_password"></i>
                </div>

                <button type="submit" id="executePasswordChangeButton">비밀번호 변경</button>
            </div>

        </form>

        <div id="message"></div>

        <div class="page-links">
             <p>
                <a href="login.html" class="link-to-page">로그인</a>|
                <a href="signup.html" class="link-to-page">회원가입</a>
            </p>
             <p>
                <a href="find_username.html" class="link-to-page">아이디 찾기</a> |
                <a href="change_password.html" class="link-to-page">비밀번호 찾기</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
